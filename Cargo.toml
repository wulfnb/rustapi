[package]
name = "rustapi"
version = "0.1.0"
edition = "2021"
description = "A fast, file-based API testing client inspired by Bruno"
repository = "https://github.com/wulfnb/rustapi"
authors = ["Noufal Babu"]
license = "GPL-3.0-or-later"

[dependencies]
# GUI Framework
eframe = "0.30"
egui = "0.30"
egui_extras = { version = "0.30", features = ["image"] }

# HTTP Client
reqwest = { version = "0.12", features = ["json", "blocking", "multipart", "cookies", "stream", "rustls-tls"] }
tokio = { version = "1.41", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
rfd = "0.15"  # File dialogs
syntect = "5.2"  # Syntax highlighting
anyhow = "1.0"
thiserror = "1.0"
urlencoding = "2.1"

tempfile = "3.23"
base64 = "0.22"
sha2 = "0.10"
csv = "1.4"
shlex = "1.3"
rquickjs = "0.14"
aes-gcm = "0.10"
argon2 = "0.6"
cookie_store = "0.22"
ctrlc = "3.5"

# Async runtime
pollster = "0.3"

# Direct3D works on Windows runners without an OpenGL driver installation.
[target.'cfg(windows)'.dependencies]
eframe = { version = "0.30", features = ["wgpu"] }
wgpu = { version = "23.0", default-features = false, features = ["dx12"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
strip = "debuginfo"

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
