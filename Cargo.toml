[package]
name = "rustapi"
version = "0.1.0"
edition = "2021"
description = "A fast, file-based API testing client inspired by Bruno"
authors = ["Noufal Babu"]
license = "GPL-3.0-or-later"
repository = "https://github.com/wulfnb/rustapi"

[dependencies]
# GUI Framework
eframe = "0.29"
egui = "0.29"
egui_extras = { version = "0.29", features = ["image"] }

# HTTP Client
reqwest = { version = "0.12", features = ["json", "blocking", "multipart"] }
tokio = { version = "1.41", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Utilities
base64 = "0.22"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
rfd = "0.15"  # File dialogs
syntect = "5.2"  # Syntax highlighting
anyhow = "1.0"
thiserror = "1.0"
urlencoding = "2.1"

# Async runtime
pollster = "0.3"

# Direct3D works on Windows runners without an OpenGL driver installation.
[target.'cfg(windows)'.dependencies]
eframe = { version = "0.29", features = ["wgpu"] }
wgpu = { version = "22.1", default-features = false, features = ["dx12"] }

[profile.release]
opt-level = 3
lto = true
strip = "debuginfo"

[dev-dependencies]
tempfile = "3.23"
