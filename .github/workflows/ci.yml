name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  # Loopback integration tests must never pass through the runner's proxy.
  NO_PROXY: 127.0.0.1,localhost

jobs:
  native:
    name: Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux native and display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          xargs -a docker/build-packages.txt sudo apt-get install -y --no-install-recommends
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri
      - name: Install the repository Rust toolchain
        run: rustup show active-toolchain
      - name: Use OpenSSL 3 for independent signature verification
        if: runner.os == 'macOS'
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          openssl_bin="$(brew --prefix openssl@3)/bin"
          "$openssl_bin/openssl" version
          echo "$openssl_bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lints (warnings are errors)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit and loopback integration tests
        run: cargo test --locked --all-targets
      - name: Browser connector regression tests
        run: node --test tests/browser_connector.mjs
      - name: Documentation tests
        run: cargo test --locked --doc
      - name: Build native application
        run: cargo build --locked
      - name: Install generated-sample test dependency
        run: python -m pip install requests==2.32.5
      - name: Validate generated cURL, Python, JavaScript and Rust requests
        shell: bash
        run: |
          cargo build --locked --examples
          if [ "$RUNNER_OS" = Windows ]; then
            RUSTAPI_BASH="$(cygpath -w /bin/bash.exe)"
            export RUSTAPI_BASH
          fi
          python scripts/codegen-smoke.py target/debug
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        if: runner.os == 'Linux'
        with:
          sdk: '3.13.7'
      - name: Validate additional SDK exports and transport policies
        if: runner.os == 'Linux'
        env:
          RUSTAPI_CODEGEN_CACHE: ${{ runner.temp }}/rustapi-codegen
        run: python tests/codegen_targets.py target/debug
      - name: Independent MQTT, Socket.IO and gRPC interoperability
        if: runner.os == 'Linux'
        shell: bash
        run: |
          npm ci --prefix tests/protocol-interop --ignore-scripts --no-audit --no-fund
          curl --fail --silent --show-error --location \
            https://github.com/fullstorydev/grpcurl/releases/download/v1.9.4/grpcurl_1.9.4_linux_x86_64.tar.gz \
            --output "$RUNNER_TEMP/grpcurl.tar.gz"
          echo "97e13d58d2733a0e62cd2571d1d5f0c02823f0d25282f08bddedf1ad9c5d1736  $RUNNER_TEMP/grpcurl.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/grpcurl.tar.gz" -C "$RUNNER_TEMP" grpcurl
          export RUSTAPI_GRPCURL="$RUNNER_TEMP/grpcurl"
          python tests/protocol-interop/validate.py target/debug/rustapi "$PWD/tests/protocol-interop"
      - name: Desktop startup (Linux software renderer)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a python scripts/desktop-smoke.py target/debug/rustapi
      - name: Desktop startup (macOS / Windows)
        if: runner.os != 'Linux'
        shell: bash
        env:
          WGPU_BACKEND: dx12
        run: |
          binary=target/debug/rustapi
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          python scripts/desktop-smoke.py "$binary"

  docker:
    name: Docker tests and browser desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test inside Linux builder
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test
          push: false
          cache-from: type=gha,scope=docker-test
          cache-to: type=gha,scope=docker-test,mode=max
      - name: Build runnable desktop image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: rustapi:ci
          cache-from: type=gha,scope=docker-runtime
          cache-to: type=gha,scope=docker-runtime,mode=max
      - name: Check Compose configuration
        run: docker compose config --quiet
      - name: Real GUI, WebSocket, and persistent volume smoke test
        run: python scripts/docker-smoke.py rustapi:ci
      - name: Scan Docker image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: rustapi:ci
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  quality:
    name: Workflow, shell, and coverage checks
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux native and desktop coverage dependencies
        run: |
          sudo apt-get update
          xargs -a docker/build-packages.txt sudo apt-get install -y --no-install-recommends
          xargs -a docker/coverage-packages.txt sudo apt-get install -y --no-install-recommends
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Python coverage tooling
        run: python -m pip install -r requirements-dev.txt
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-audit@0.22.2
      - name: Audit crate dependencies for security vulnerabilities
        run: cargo audit
      - name: Install gitleaks and workflow linter
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz"
          echo "cb49b7de5ee986510fe8666ca0273a6cc15eb82571f2f14832c9e8920751f3a4  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
          rm -f "$RUNNER_TEMP/gitleaks.tar.gz"
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Scan repository for secret and credential leaks
        run: gitleaks detect --verbose --config .gitleaks.toml
      - name: Validate workflow and shell scripts
        run: |
          actionlint
          shellcheck docker/start-desktop.sh
          python3 -m compileall -q scripts docker
      - name: Website JavaScript test
        run: node --test tests/site_tests.mjs
      - name: Python statement/branch coverage and shell execution coverage
        env:
          RUSTAPI_COVERAGE_DIR: coverage
        run: |
          python -m coverage run -m unittest discover -s tests/python -v
          python -m coverage report
          python -m coverage json -o coverage/python.json
      - name: Rust unit and integration coverage
        run: |
          rustup component add llvm-tools-preview
          cargo llvm-cov clean --workspace
          cargo llvm-cov --locked --all-targets --no-report
      - name: Real native dialogs and desktop lifecycle coverage
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          XDG_CURRENT_DESKTOP: GNOME
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/rustapi-xdg"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          export LLVM_PROFILE_FILE="$PWD/target/llvm-cov-target/native-%p-%m.profraw"
          xvfb-run -a -s '-screen 0 1800x1200x24' dbus-run-session -- \
            python tests/native_desktop.py target/llvm-cov-target/debug/rustapi --output coverage/native
          xvfb-run -a -s '-screen 0 1800x1200x24' dbus-run-session -- \
            python scripts/desktop-smoke.py target/llvm-cov-target/debug/rustapi
      - name: Enforce Rust source coverage
        run: |
          cargo llvm-cov report --json --output-path coverage/rust.json
          cargo llvm-cov report --lcov --output-path coverage/lcov.info
          cargo llvm-cov report --show-missing-lines --summary-only --fail-under-lines 75 --fail-under-functions 75
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-linux
          path: coverage/
          if-no-files-found: error

  ci-gate:
    name: CI Completion Gate
    if: always()
    needs: [native, docker, quality]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify all checks passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "CI Results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success) ;;
              *) exit 1 ;;
            esac
          done
          echo "All parallel CI checks and integration test suites succeeded."
