name: CD

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  validate:
    name: Require complete CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release-info:
    name: Validate release identity
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.info.outputs.tag }}
      prerelease: ${{ steps.info.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Match version tags to Cargo.toml
        id: info
        shell: python
        run: |
          import os, re, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          ref = os.environ['GITHUB_REF']
          if ref.startswith('refs/tags/'):
              tag = ref.removeprefix('refs/tags/')
              if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?', tag) or tag != 'v' + version:
                  raise SystemExit('Release tag must equal v + Cargo.toml version')
              prerelease = '-' in version
          elif ref == 'refs/heads/main':
              tag = 'preview-' + os.environ['GITHUB_SHA'][:12]
              prerelease = True
          else:
              raise SystemExit('Publishing is limited to main or version tags')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\nprerelease={str(prerelease).lower()}\n')

  package:
    name: Package ${{ matrix.platform }} ${{ matrix.arch }}
    needs: [validate, release-info]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x86_64
          - os: macos-15
            platform: macos
            arch: arm64
          - os: macos-15-intel
            platform: macos
            arch: x86_64
          - os: windows-2022
            platform: windows
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux native and display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          xargs -a docker/build-packages.txt sudo apt-get install -y --no-install-recommends
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install license notice generator
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-about@0.9.2
      - name: Generate third-party license notices
        run: cargo about generate --locked --fail --config about.toml --output-file THIRD-PARTY-NOTICES.html about.hbs
      - name: Build release
        run: cargo build --locked --release
      - name: Package and extract distribution
        id: package
        shell: bash
        run: |
          binary=target/release/rustapi
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          python scripts/package.py --binary "$binary" --platform '${{ matrix.platform }}' --arch '${{ matrix.arch }}'
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($compiler) { $iscc = $compiler.Source }
          else { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (Test-Path $iscc) {
            & $iscc packaging\windows\rustapi.iss
          }
      - name: Verify packaged application (Linux)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          BINARY: ${{ steps.package.outputs.binary }}
        run: xvfb-run -a python scripts/desktop-smoke.py "$BINARY"
      - name: Verify packaged application (macOS / Windows)
        if: runner.os != 'Linux'
        env:
          BINARY: ${{ steps.package.outputs.binary }}
          WGPU_BACKEND: dx12
        shell: bash
        run: python scripts/desktop-smoke.py "$BINARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.tar.gz
            dist/*-Setup.exe
          if-no-files-found: error

  image:
    name: Publish tested Docker image
    needs: [validate, release-info, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      reference: ${{ steps.identity.outputs.name }}@${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Registry image identity
        id: identity
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build the exact image to publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ steps.identity.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=docker-runtime
          cache-to: type=gha,scope=docker-runtime,mode=max
      - name: Verify image before publishing
        env:
          IMAGE: ${{ steps.identity.outputs.name }}:sha-${{ github.sha }}
        run: python scripts/docker-smoke.py "$IMAGE"
      - name: Scan Docker image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # 0.29.0
        with:
          image-ref: ${{ steps.identity.outputs.name }}:sha-${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push validated image and channel tags
        id: push
        env:
          IMAGE: ${{ steps.identity.outputs.name }}
          RELEASE_TAG: ${{ needs.release-info.outputs.tag }}
          PRERELEASE: ${{ needs.release-info.outputs.prerelease }}
        run: |
          immutable="$IMAGE:sha-$GITHUB_SHA"
          docker push "$immutable"
          digest=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$immutable" | awk -F@ -v name="$IMAGE" '$1 == name {print $2; exit}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" = refs/heads/main ]; then channel=edge; else channel="$RELEASE_TAG"; fi
          docker buildx imagetools create --tag "$IMAGE:$channel" "$IMAGE@$digest"
          if [ "$PRERELEASE" = false ]; then
            docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$digest"
          fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event.repository.private == false || vars.ENABLE_PRIVATE_ATTESTATIONS == 'true'
        with:
          subject-name: ${{ steps.identity.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish:
    name: Publish native downloads and checksums
    needs: [release-info, package, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: release-files
      - name: Require all six distributions and generate checksums
        working-directory: release-files
        run: |
          test -f RustAPI-linux-x86_64.tar.gz
          test -f RustAPI-windows-x86_64.zip
          for arch in arm64 x86_64; do
            test -f "RustAPI-macos-$arch.zip"
            test -f "RustAPI-macos-$arch.dmg"
          done
          sha256sum -- *.zip *.dmg *.tar.gz *.exe 2>/dev/null > SHA256SUMS.txt || sha256sum -- *.zip *.dmg *.tar.gz > SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event.repository.private == false || vars.ENABLE_PRIVATE_ATTESTATIONS == 'true'
        with:
          subject-checksums: release-files/SHA256SUMS.txt
      - name: Publish release for the validated commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-info.outputs.tag }}
          PRERELEASE: ${{ needs.release-info.outputs.prerelease }}
          IMAGE: ${{ needs.image.outputs.reference }}
        run: |
          cat > release-notes.md <<EOF
          ## RustAPI — Release $RELEASE_TAG

          This release was built from commit \`$GITHUB_SHA\` on branch \`$GITHUB_REF_NAME\`.

          ### Multi-Platform Downloads

          | Platform | Distribution Package | Description |
          | :--- | :--- | :--- |
          | **macOS (Apple Silicon)** | \`RustAPI-macos-arm64.dmg\` / \`.zip\` | Native macOS app for Apple Silicon (M1/M2/M3/M4) |
          | **macOS (Intel)** | \`RustAPI-macos-x86_64.dmg\` / \`.zip\` | Native macOS app for Intel-based Macs |
          | **Linux (x86_64)** | \`RustAPI-linux-x86_64.tar.gz\` | Portable Linux archive |
          | **Windows (x64)** | \`RustAPI-windows-x86_64.zip\` / \`-Setup.exe\` | Portable Windows archive and installer |

          Every download contains \`LICENSE\` (GPL-3.0-or-later), \`NOTICE\`, and \`THIRD-PARTY-NOTICES.html\`.

          ### Docker Container

          \`\`\`sh
          docker pull $IMAGE
          docker run -d --name rustapi -p 127.0.0.1:6080:6080 -v rustapi-data:/data $IMAGE
          \`\`\`

          Navigate to **http://localhost:6080** to access the web GUI.

          ### Integrity & Verification

          SHA256 checksums are in \`SHA256SUMS.txt\`. Verify provenance via GitHub CLI:

          \`\`\`sh
          gh attestation verify RustAPI-macos-arm64.dmg --repo $GITHUB_REPOSITORY
          \`\`\`
          EOF
          options=()
          if [ "$PRERELEASE" = true ]; then options+=(--prerelease --latest=false); else options+=(--latest); fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # A rerun may repair an existing draft; do not overwrite a published release.
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "RustAPI $RELEASE_TAG" --draft --notes-file release-notes.md "${options[@]}"
          fi
          gh release upload "$RELEASE_TAG" release-files/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false "${options[@]}"
